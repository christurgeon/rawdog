name: Release

# Builds rawdog for macOS, Linux, and Windows. On a pushed tag such as
# v0.2.0, the builds are attached to a GitHub Release. When started by hand,
# or on a pull request that changes this file, it only uploads them as
# workflow artifacts, to test the builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Test the builds when this workflow changes.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: rawdog-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: rawdog-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: rawdog-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: rawdog-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: rawdog-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="${{ matrix.name }}"
          mkdir "$dir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rawdog.exe" "$dir/"
            cp README.md LICENSE* "$dir/" 2>/dev/null || true
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/rawdog" "$dir/"
            cp README.md LICENSE* "$dir/" 2>/dev/null || true
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}
